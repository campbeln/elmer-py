<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Ticket queue — Manage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/www/managetickets/shared.css" />
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="/www/managetickets/shared.jsx"></script>

<script type="text/babel" data-presets="react">
(() => {
const { useEffect, useMemo, useState } = React;
const { useBranding, Brand, Nav, KeyGate, api, SevBadge, StatusBadge, fmtDate,
        IconEye, IconPencil } = window.Manage;

const PRIORITY_OPTIONS = ["", "P1", "P2", "P3", "P4"];
const STATUS_OPTIONS = ["", "open", "acknowledged", "in_progress", "resolved", "closed"];

/* Sort key -> value extractor. Priority/status sort correctly as plain
 * strings ("P1" < "P2" < ... lexically matches severity order). Email and
 * company compare case-insensitively; company falls back to "" so blanks
 * group predictably rather than scattering by locale rules. */
const SORT_GETTERS = {
  priority: (t) => t.priority || "",
  status: (t) => t.status || "",
  email: (t) => (t.email || "").toLowerCase(),
  company: (t) => (t.company || "").toLowerCase(),
  created_at: (t) => t.created_at || "",
  updated_at: (t) => t.updated_at || "",
};

function SortableTh({ label, sortKey, sort, onSort, className = "" }) {
  const active = sort.key === sortKey;
  return (
    <th className={("sortable " + className).trim()} onClick={() => onSort(sortKey)}
        aria-sort={active ? (sort.dir === "asc" ? "ascending" : "descending") : "none"}>
      {label}
      <span className="sort-caret">{active ? (sort.dir === "asc" ? "▲" : "▼") : ""}</span>
    </th>
  );
}

function Queue({ adminKey }) {
  const [priority, setPriority] = useState("");
  const [status, setStatus] = useState("");
  const [email, setEmail] = useState("");
  const [company, setCompany] = useState("");
  const [tickets, setTickets] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: "asc" });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function load() {
    setBusy(true);
    setError(null);
    const params = new URLSearchParams();
    if (priority) params.set("priority", priority);
    if (status) params.set("status", status);
    if (email.trim()) params.set("email", email.trim());
    if (company.trim()) params.set("company", company.trim());
    params.set("limit", "100");
    const res = await api("/tickets/?" + params.toString(), adminKey);
    if (res.ok && res.data) {
      setTickets(res.data.tickets || []);
    } else {
      setError((res.data && res.data.error) || "The queue could not be loaded.");
    }
    setBusy(false);
  }

  useEffect(() => { load(); }, []);   // initial load once unlocked

  function toggleSort(key) {
    setSort((prev) => prev.key === key
      ? { key, dir: prev.dir === "asc" ? "desc" : "asc" }
      : { key, dir: "asc" });
  }

  // Sorting is client-side over the already-fetched page: instant, and
  // independent of which server-side filters are active.
  const sortedTickets = useMemo(() => {
    if (!tickets || !sort.key) return tickets;
    const get = SORT_GETTERS[sort.key];
    return [...tickets].sort((a, b) => {
      const av = get(a), bv = get(b);
      if (av < bv) return sort.dir === "asc" ? -1 : 1;
      if (av > bv) return sort.dir === "asc" ? 1 : -1;
      return 0;
    });
  }, [tickets, sort]);

  function goto(url, e) {
    if (e) e.stopPropagation();
    window.location.href = url;
  }

  return (
    <React.Fragment>
      <div className="filters-queue">
        <label>
          <span className="tag">Severity</span>
          <select value={priority} onChange={(e) => setPriority(e.target.value)}>
            {PRIORITY_OPTIONS.map((p) => <option key={p} value={p}>{p || "All"}</option>)}
          </select>
        </label>
        <label>
          <span className="tag">Status</span>
          <select value={status} onChange={(e) => setStatus(e.target.value)}>
            {STATUS_OPTIONS.map((s) => <option key={s} value={s}>{s ? s.replace("_", " ") : "All"}</option>)}
          </select>
        </label>
        <label>
          <span className="tag">Email contains</span>
          <input value={email} onChange={(e) => setEmail(e.target.value)}
                 placeholder="@gmail.com" />
        </label>
        <label>
          <span className="tag">Company contains</span>
          <input value={company} onChange={(e) => setCompany(e.target.value)}
                 placeholder="Acme" />
        </label>
        <button className="btn" onClick={load} disabled={busy}>
          {busy ? "Loading…" : "Apply filters"}<span className="arrow">→</span>
        </button>
      </div>

      {error && <div className="error" role="alert">{error}</div>}

      {tickets && tickets.length === 0 && !error && (
        <p className="empty">No tickets match these filters.</p>
      )}

      {sortedTickets && sortedTickets.length > 0 && (
        <div className="table-scroll">
        <table className="tickets-table">
          <thead>
            <tr>
              <SortableTh label="Sev" sortKey="priority" sort={sort} onSort={toggleSort} />
              <th>Subject</th>
              <SortableTh label="Status" sortKey="status" sort={sort} onSort={toggleSort} className="col-status" />
              <SortableTh label="Email" sortKey="email" sort={sort} onSort={toggleSort} />
              <SortableTh label="Company" sortKey="company" sort={sort} onSort={toggleSort} />
              <SortableTh label="Opened" sortKey="created_at" sort={sort} onSort={toggleSort} />
              <SortableTh label="Updated" sortKey="updated_at" sort={sort} onSort={toggleSort} />
              <th>Ticket ID</th>
            </tr>
          </thead>
          <tbody>
            {sortedTickets.map((t) => {
              const viewUrl = "/www/managetickets/view/?id=" + t.id;
              const statusUrl = "/www/managetickets/status/?id=" + t.id;
              return (
                <tr key={t.id} className="clickable" tabIndex={0}
                    role="link"
                    aria-label={"Open ticket " + t.subject}
                    onClick={() => goto(viewUrl)}
                    onKeyDown={(e) => { if (e.key === "Enter") goto(viewUrl); }}>
                  <td><SevBadge code={t.priority} /></td>
                  <td>
                    <div className="subject">{t.subject}</div>
                    <div className="who">{t.name}</div>
                  </td>
                  <td className="col-status"><StatusBadge status={t.status} /></td>
                  <td className="who">{t.email}</td>
                  <td className="who">{t.company || "—"}</td>
                  <td className="mono">{fmtDate(t.created_at)}</td>
                  <td className="mono">{fmtDate(t.updated_at)}</td>
                  <td className="mono">
                    <a href={viewUrl} onClick={(e) => e.stopPropagation()}
                       style={{ color: "var(--violet)" }}>{t.id.slice(0, 8)}…</a>
                    <div className="row-actions">
                      <button type="button" aria-label={"View ticket " + t.subject}
                              onClick={(e) => goto(viewUrl, e)}>
                        <IconEye />
                      </button>
                      <button type="button" aria-label={"Edit status for " + t.subject}
                              onClick={(e) => goto(statusUrl, e)}>
                        <IconPencil />
                      </button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        </div>
      )}
    </React.Fragment>
  );
}

function Page() {
  const branding = useBranding();
  useEffect(() => { document.title = "Ticket queue — " + branding.name; }, [branding]);
  return (
    <React.Fragment>
      <Brand branding={branding} page="Manage" />
      <Nav current="queue" />
      <p className="eyebrow">Severity triage · queue</p>
      <h1>Ticket queue</h1>
      <p className="lede">
        Every report, newest first. Filter by severity, status, email, or
        company, and click any column header to sort.
      </p>
      <KeyGate>{(adminKey) => <Queue adminKey={adminKey} />}</KeyGate>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
})();
</script>
</body>
</html>
