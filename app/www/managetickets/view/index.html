<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Look up a ticket — Manage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/www/managetickets/shared.css" />
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="/www/managetickets/shared.jsx"></script>

<script type="text/babel" data-presets="react">
(() => {
const { useEffect, useState } = React;
const { useBranding, Brand, Nav, KeyGate, api, SevBadge, StatusBadge, fmtDate, UpdatesList } = window.Manage;

function Lookup({ adminKey }) {
  // Deep-linkable from the queue page: /www/managetickets/view/?id=<uuid>
  const initial = new URLSearchParams(window.location.search).get("id") || "";
  const [ticketId, setTicketId] = useState(initial);
  const [ticket, setTicket] = useState(null);
  const [updates, setUpdates] = useState([]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function load(id) {
    if (!id) return;
    setBusy(true);
    setError(null);
    setTicket(null);
    const res = await api("/tickets/" + encodeURIComponent(id.trim()), adminKey);
    if (res.ok && res.data && res.data.ticket) {
      setTicket(res.data.ticket);
      setUpdates(res.data.updates || []);
    } else {
      setError((res.data && res.data.error) || "The ticket could not be read.");
    }
    setBusy(false);
  }

  useEffect(() => { if (initial) load(initial); }, []);

  function submit(e) {
    e.preventDefault();
    load(ticketId);
  }

  return (
    <React.Fragment>
      <form onSubmit={submit} className="filters" style={{ gridTemplateColumns: "1fr auto" }}>
        <label>
          <span className="tag">Ticket ID</span>
          <input value={ticketId} onChange={(e) => setTicketId(e.target.value)}
                 placeholder="00000000-0000-0000-0000-000000000000" />
        </label>
        <button className="btn" type="submit" disabled={busy || !ticketId.trim()}>
          {busy ? "Loading…" : "Look up"}<span className="arrow">→</span>
        </button>
      </form>

      {error && <div className="error" role="alert">{error}</div>}

      {ticket && (
        <div className="detail">
          <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
            <SevBadge code={ticket.priority} />
            <StatusBadge status={ticket.status} />
            <span className="mono">{ticket.id}</span>
          </div>
          <div className="field">
            <span className="tag">Subject</span>
            <div className="subject" style={{ fontWeight: 500 }}>{ticket.subject}</div>
          </div>
          <div className="field">
            <span className="tag">Reporter</span>
            <div>{ticket.name}{ticket.company ? " — " + ticket.company : ""} · {ticket.email}</div>
          </div>
          <div className="field">
            <span className="tag">Description</span>
            <div className="desc">{ticket.description}</div>
          </div>
          <div className="field">
            <span className="tag">Status updates</span>
            <UpdatesList updates={updates} />
          </div>
          <div className="field">
            <span className="tag">Timeline</span>
            <div className="who">
              Opened {fmtDate(ticket.created_at)}
              {ticket.updated_at && ticket.updated_at !== ticket.created_at
                ? " · Updated " + fmtDate(ticket.updated_at) : ""}
            </div>
          </div>
          <div>
            <a className="btn-quiet" style={{ textDecoration: "none", display: "inline-block" }}
               href={"/www/managetickets/status/?id=" + ticket.id}>
              Update status
            </a>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function Page() {
  const branding = useBranding();
  useEffect(() => { document.title = "Look up a ticket — " + branding.name; }, [branding]);
  return (
    <React.Fragment>
      <Brand branding={branding} page="Manage" />
      <Nav current="view" />
      <p className="eyebrow">Severity triage · look up</p>
      <h1>Look up a ticket</h1>
      <p className="lede">Fetch the full record for a single ticket by its ID.</p>
      <KeyGate>{(adminKey) => <Lookup adminKey={adminKey} />}</KeyGate>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
})();
</script>
</body>
</html>
